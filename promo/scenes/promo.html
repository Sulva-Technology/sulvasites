<style>

  .phone { position: absolute; border-radius: 54px; padding: 14px; background: #0b0d12; box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.14), inset 0 0 0 2px #2a2f3c; }

  .pill { position: absolute; display: inline-flex; align-items: center; gap: 18px; border-radius: 60px; white-space: nowrap; }

<body>

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOutExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const eOutCubic = (p) => 1 - Math.pow(1 - p, 3);
const eInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const eOutBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const eIn = (p) => p * p * p;
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || cam).appendChild(e);
  return e;
}
function css(e, o) { for (const k in o) e.style[k] = o[k]; return e; }
window.pending = [];
function setSrc(img, src) { if (img.getAttribute("src") !== src) { img.src = src; window.pending.push(img.decode().catch(() => {})); } }
function show(e, on) { e.style.display = on ? (e.classList.contains("scene") ? "block" : "") : "none"; }

// "slam" in: scale from big, fade in fast
function slam(t, at, dur = 0.22) { const p = seg(t, at, at + dur); return { o: clamp(p * 3), s: lerp(1.35, 1, eOutExpo(p)), p }; }
const MARK = '<svg viewBox="0 0 274 329" width="100%" height="100%"><path fill="currentColor" d="M89 92.5C89 37 126 0 181.5 0S274 37 274 92.5L89 185ZM185 236.5C185 292 148 329 92.5 329S0 292 0 236.5L185 144Z"/></svg>';
const ICON = {

  store: '<svg viewBox="0 0 24 24" fill="none" stroke="#7fd0ff" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  pay: '<svg viewBox="0 0 24 24" fill="none" stroke="#7fd0ff" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="#7fd0ff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="#7fd0ff" stroke-width="2"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
function browser(parent, url) {
  const b = el("div", "browser", parent, `<div class="bar"><i></i><i></i><i></i><div class="url">${url}</div></div><div class="view"><img></div>`);

  return { root: p, img: p.querySelector("img") };
}

// ---------- background ----------
const bg = document.getElementById("bg");
const g1 = document.getElementById("g1"), g2 = document.getElementById("g2"), g3 = document.getElementById("g3");
css(g1, { width: "900px", height: "900px", background: "#0a4fe0" });
css(g2, { width: "800px", height: "800px", background: "#1b8cff" });

// ================= SCENES =================
const S = {};

// ---- 1. HOOK 0-4 ----
S.hook = el("div", "scene");
const sPill = el("div", "search", S.hook, `${ICON.search}<span id="q"></span><span class="caret"></span>`);
const qEl = sPill.querySelector("#q"), caretEl = sPill.querySelector(".caret");
const hookL1 = el("div", "kinetic", S.hook, `<span class="word">Your</span> <span class="word">customers</span><br><span class="word">are</span> <span class="word">searching.</span>`);
const hookL2 = el("div", "kinetic", S.hook, `<span class="word">Can</span> <span class="word">they</span> <span class="word">find</span><br><span class="word serif" style="color:var(--orange)">you?</span>`);

  { t: 6.0, k: "t7", m: "dark", name: "Restaurant", tpl: "Tavola", c: "#ff8a4c" },
  { t: 7.0, k: "t5", m: "light", name: "Beauty & booking", tpl: "Maison", c: "#e2638f" },

  { t: 9.0, k: "t6", m: "light", name: "Real estate", tpl: "Estate", c: "#b08d57" },

  { t: 11.0, k: "t11", m: "light", name: "Events", tpl: "Soirée", c: "#f2a7c3" },
  { t: 11.5, k: "t14", m: "light", name: "Online store", tpl: "Cartly", c: "#1b8cff" },
  { t: 12.0, k: "t10", m: "light", name: "Education", tpl: "Campus", c: "#ffb020" },
  { t: 12.5, k: "t16", m: "light", name: "Community", tpl: "Circle", c: "#3b9ad0" },

const mHead = el("div", "abs", S.montage);
css(mHead, { fontWeight: 600, letterSpacing: "-0.035em", lineHeight: 0.92 });

const mChip = el("div", "chip", S.montage, `<b></b><em style="font-style:normal"></em><span></span>`);

const WALL_KEYS = ["t1","t2","t3","t4","t5","t6","t7","t8","t9","t10","t11","t12","t13","t14","t15","t16","t17"];
const wallTiles = [];
const WALL_COLS = V ? 4 : 6, TW = V ? 300 : 300, TH = V ? 600 : 600, GAP = 28;
for (let i = 0; i < 18; i++) {
  const key = WALL_KEYS[i % 17];

}
const wallCols = WALL_COLS, wallRows = Math.ceil(18 / WALL_COLS);
const wallW = wallCols * (TW + GAP), wallH = wallRows * (TH + GAP) + 140;
const wallScrim = el("div", "abs", S.montage);

const wallText = el("div", "abs", S.montage, `<div style="font-size:${V ? 150 : 170}px;font-weight:600;letter-spacing:-.035em;line-height:.9">17 designs.</div><div class="serif" style="font-size:${V ? 170 : 190}px;line-height:1;color:var(--foam)">Pick yours.</div>`);

const eHead = el("div", "abs", S.editor);

const app = el("div", "app", S.editor, `<div class="top"><i></i><i></i><i></i><div class="ttl"><span style="width:20px;height:24px;display:inline-block;color:var(--ink)">${MARK}</span>Sulva Sites · Editor</div></div>`);
const panel = el("div", "panel", app, `

const inBox = panel.querySelector("#in"), inText = panel.querySelector("#inText"), inCaret = panel.querySelector("#inCaret");
const sws = [...panel.querySelectorAll(".sw")];
const tog = panel.querySelector("#tog"), togKnob = tog.querySelector("i");
const pub = panel.querySelector("#pub");
const preview = el("div", "preview", app);
const mini = el("div", "mini", preview, `

// ---------- per-frame render ----------
function render(t) {
  for (const s of ALL) show(s, false);
  // camera shake on hits
  let sx = 0, sy = 0;
  for (const hit of [4.0, 6.0, 20.0, 26.0]) {
    const d = t - hit;
    if (d >= 0 && d < 0.35) { const a = 18 * Math.exp(-d * 14); sx += Math.sin(d * 97) * a; sy += Math.cos(d * 83) * a; }
  }
  cam.style.transform = `translate(${sx}px, ${sy}px)`;
  // flash
  let fl = 0;
  for (const hit of [4.0, 6.0, 20.0, 26.0]) { const d = t - hit; if (d >= 0) fl = Math.max(fl, Math.exp(-d * 9) * (hit === 26 || hit === 4 ? 0.85 : 0.45)); }
  flash.style.opacity = fl;

  // background per scene
  const light = t >= 14 && t < 20;
  stage.style.background = light ? "#f4f7fc" : (t >= 26 ? WATER : "#0a0f1f");
  const drift = (a, sp, ph) => Math.sin(t * sp + ph) * a;
  tf(g1, W * 0.15 - 450 + drift(120, 0.7, 0), H * 0.25 - 450 + drift(90, 0.5, 1));
  tf(g2, W * 0.85 - 400 + drift(140, 0.6, 2), H * 0.8 - 400 + drift(100, 0.8, 3));
  tf(g3, W * 0.7 - 300 + drift(160, 0.9, 4), H * 0.1 - 300 + drift(80, 0.6, 5));
  g1.style.opacity = light ? 0.18 : (t >= 26 ? 0.25 : 0.55);
  g2.style.opacity = light ? 0.15 : (t >= 26 ? 0.3 : 0.45);
  g3.style.opacity = light ? 0.08 : (t < 4 ? 0.0 : t >= 26 ? 0.18 : 0.12);
  g2.style.background = t >= 26 ? "#7fd0ff" : "#1b8cff";

  if (t < 4) renderHook(t);
  else if (t < 6) renderLogo(t);
  else if (t < 14) renderMontage(t);
  else if (t < 20) renderEditor(t);
  else if (t < 26) renderLive(t);
  else renderCta(t);
}

  sPill.style.transform = `translateY(${lerp(40, 0, pIn) - out * 160}px) scale(${lerp(0.9, 1, pIn) * (1 - out * 0.1)})`;
  sPill.style.filter = `blur(${out * 14}px)`;

function cutAt(t) { let c = null; for (const x of CUTS) if (t >= x.t) c = x; return c; }
function renderMontage(t) {
  show(S.montage, true);
  const inWall = t >= 13.0;
  const c = cutAt(t);
  const idx = CUTS.indexOf(c);
  const next = CUTS[idx + 1];
  const dur = (next ? next.t : 13.0) - c.t;
  const local = t - c.t;
  const pin = eOutExpo(seg(local, 0, 0.18));
  const dir = idx % 2 ? 1 : -1;
  // headline
  const h1 = t < 9.0;
  if (V) css(mHead, { left: 0, right: 0, textAlign: "center", top: L.mHeadY + "px", fontSize: (h1 ? 140 : 110) + "px" });
  else css(mHead, { left: L.mHeadX + "px", top: (h1 ? L.mHeadY : L.mHeadY - 30) + "px", fontSize: (h1 ? L.mHeadSize : 112) + "px", width: "600px" });

  mHead.innerHTML = h1 ? `<span style="color:var(--foam)">17</span> designs.` : (V ? `Every kind of<br><span class="serif" style="color:var(--foam);font-size:1.15em">business.</span>` : `Every<br>kind of<br><span class="serif" style="color:var(--foam);font-size:1.15em">business.</span>`);
  mHead.style.opacity = hs.o * (1 - seg(t, 12.85, 13.0));
  mHead.style.transform = `scale(${hs.s})`;

  // devices

  show(mBrowser.root, vis && !V); show(mPhone.root, vis); show(mChip, vis); show(mCount, vis && !V);
  if (vis) {
    const scroll = (lerp(0, 1, local / Math.max(dur, 0.5))) ;
    if (!V) {
      css(mBrowser.root, { left: L.bX + "px", top: L.bY + "px", width: L.bW + "px", height: L.bH + "px" });
      const bimg = `${CAP}${c.k}-desk-${c.m}.jpg`;

    }

    mChip.querySelector("em").textContent = c.name;

    css(mChip, { left: (V ? (W - cw) / 2 : L.bX + 40) + "px", top: L.chipY + "px" });
    mChip.style.transform = `translateY(${(1 - pin) * 24}px)`; mChip.style.opacity = pin;

    wall.style.transform = `perspective(2400px) rotateX(${18}deg) rotateZ(${-10}deg) scale(${lerp(1.5, V ? 1.0 : 0.95, p)}) translateY(${-seg(t, 13, 14) * 120 + exit * -900}px)`;
    wallTiles.forEach((tile, i) => { tile.style.opacity = clamp((t - 13.0 - (i % 6) * 0.03) * 8); });
    wallScrim.style.opacity = p;

    wallText.style.opacity = ts.o * (1 - exit);
    wallText.style.transform = `scale(${ts.s * (1 + exit * 0.3)})`;
    wall.style.opacity = 1 - exit * 0.6;
  }
}

function rectIn(elm) { const r = elm.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height }; }
function renderEditor(t) {
  show(S.editor, true);
  // headline
  const h1 = t < 17.0;
  eHead.innerHTML = h1 ? `Make it <span class="serif" style="color:var(--deep);font-size:1.12em">yours.</span>` : `No code. <span class="serif" style="color:var(--deep);font-size:1.12em">No stress.</span>`;
  const hs = slam(t, h1 ? 14.0 : 17.0, 0.25);
  if (V) css(eHead, { left: 0, right: 0, textAlign: "center", top: "120px", fontSize: "120px" });
  else css(eHead, { left: "110px", top: "54px", fontSize: "110px" });
  eHead.style.opacity = hs.o; eHead.style.transform = `scale(${hs.s})`; eHead.style.transformOrigin = V ? "50% 50%" : "0 50%";
  // app window
  const ain = eOutExpo(seg(t, 14.0, 14.45));
  const aout = eIn(seg(t, 19.75, 20.0));
  const A = V ? { x: 50, y: 330, w: 980, h: 1500 } : { x: 110, y: 205, w: 1700, h: 840 };
  css(app, { left: A.x + "px", top: A.y + "px", width: A.w + "px", height: A.h + "px" });
  app.style.transform = `translateY(${(1 - ain) * 120 + aout * -60}px) scale(${lerp(0.96, 1, ain) * (1 + aout * 0.08)})`;
  app.style.opacity = clamp(ain * 2) * (1 - aout);
  if (V) { css(panel, { left: 0, top: "54px", width: "100%", height: "560px", padding: "30px 40px" }); css(preview, { left: 0, top: "614px", right: 0, bottom: 0 }); }
  else { css(panel, { left: 0, top: "54px", width: "460px", bottom: 0 }); css(preview, { left: "460px", top: "54px", right: 0, bottom: 0 }); }
  if (V) { panel.querySelectorAll(".fld").forEach((f) => (f.style.marginBottom = "22px")); }

  const focused = t >= 14.5 && t < 16.8;
  inBox.classList.toggle("focus", focused);

  if (t < 14.5) { inText.textContent = "Your business"; inText.style.color = "rgba(10,15,31,.3)"; }
  mName.textContent = n ? typed : "Your business";
  mH.textContent = n ? typed : "Your business";
  // colour: blue -> orange at 17.0 -> rose at 17.5
  const colours = ["#1b8cff", "#ff5a2c", "#d6336c"];
  const ci = t >= 17.5 ? 2 : t >= 17.0 ? 1 : 0;
  sws.forEach((s, i) => s.classList.toggle("on", i === [0, 1, 2][ci]));
  const accent = colours[ci];
  // dark at 18.0
  const dk = eInOut(seg(t, 18.0, 18.3));

  mini.style.color = fg;
  mSub.style.color = dk > 0.5 ? "rgba(255,255,255,.7)" : "rgba(27,20,24,.65)";
  mEyebrow.style.color = accent;
  mBtn.style.background = accent; mNavCta.style.background = accent; mLogoDot.style.background = accent;

  mBtn.style.transform = `scale(${pulse(17.0) * pulse(17.5)})`;

    css(mSub, { marginTop: "22px", maxWidth: "800px" }); css(mBtn, { marginTop: "26px" });
    css(mPhoto, { left: "40px", right: "40px", bottom: "36px", height: "330px" });
    css(mPhotoImg, { width: "1500px", left: "-520px", top: "-200px" });
  } else {

    css(mSub, { marginTop: "24px", maxWidth: "520px" }); css(mBtn, { marginTop: "30px" });
    css(mPhoto, { right: "40px", top: "100px", width: "520px", bottom: "40px" });
    css(mPhotoImg, { width: "1700px", left: "-760px", top: "-175px" });
  }
  // publish 19.0
  const done = t >= 19.05;
  pub.innerHTML = done ? `${ICON.check} Live` : "Publish site";
  pub.style.background = done ? "#16a34a" : "var(--ink)";
  pub.style.transform = `scale(${pulse(19.0)})`;
  const ts = eOutBack(seg(t, 19.1, 19.4));
  const tw = toast.offsetWidth;
  const pr = rectIn(preview);
  css(toast, { left: pr.x + pr.w / 2 - tw / 2 + "px", top: (pr.y + 30) + "px", opacity: clamp(ts * 3) * (1 - aout) });
  toast.style.transform = `translateY(${(1 - ts) * -40}px) scale(${lerp(0.8, 1, ts)})`;
  // cursor path
  const target = (elm, dx = 0.5, dy = 0.5) => { const r = rectIn(elm); return [r.x + r.w * dx, r.y + r.h * dy]; };
  const K = [
    [14.0, [W + 60, H * 0.7]],
    [14.45, target(inBox, 0.6, 0.55)],
    [15.0, target(inBox, 0.6, 0.55)],
    [15.2, target(inBox, 0.9, 1.4)],
    [16.6, target(inBox, 0.9, 1.4)],
    [16.95, target(sws[1], 0.55, 0.55)],
    [17.05, target(sws[1], 0.55, 0.55)],

    [17.55, target(sws[2], 0.55, 0.55)],

    if (t >= K[i][0] && t <= K[i + 1][0]) { const p = eInOut(seg(t, K[i][0], K[i + 1][0])); pos = [lerp(K[i][1][0], K[i + 1][1][0], p), lerp(K[i][1][1], K[i + 1][1][1], p)]; }
  }
  if (t > K[K.length - 1][0]) pos = K[K.length - 1][1];
  let cs = 1;
  for (const at of [14.5, 17.0, 17.5, 18.0, 19.0]) { const d = t - at; if (d >= -0.05 && d < 0.12) cs = 0.82; }
  css(cursor, { transform: `translate(${pos[0] - 8}px, ${pos[1] - 4}px) scale(${cs})`, opacity: 1 - aout });
  let ro = 0, rs = 0.3;
  for (const at of [14.5, 17.0, 17.5, 18.0, 19.0]) { const d = t - at; if (d >= 0 && d < 0.4) { ro = 1 - d / 0.4; rs = lerp(0.3, 1.4, d / 0.4); } }
  css(ripple, { left: pos[0] + "px", top: pos[1] + "px", opacity: ro, transform: `scale(${rs})` });
}

function renderLive(t) {
  show(S.live, true);
  const hs = slam(t, 20.0, 0.3);
  const push = eIn(seg(t, 24.0, 25.5));
  const out = eIn(seg(t, 25.5, 26.0));
  if (V) css(lHead, { left: 0, right: 0, textAlign: "center", top: "120px", fontSize: "140px" });
  else css(lHead, { left: "110px", top: "200px", fontSize: "150px" });
  lHead.style.opacity = hs.o * (1 - out); lHead.style.transform = `scale(${hs.s})`; lHead.style.transformOrigin = V ? "50% 50%" : "0 50%";
  const din = eOutExpo(seg(t, 20.0, 20.5));
  const scroll = seg(t, 20.2, 25.5);
  // laptop
  const LP = V ? { x: 60, y: 560, w: 960, h: 600 } : { x: 760, y: 170, w: 1000, h: 625 };
  css(laptop, { left: LP.x + "px", top: LP.y + "px", width: LP.w + "px", height: LP.h + 26 + "px" });
  css(lapLid, { height: LP.h + "px" }); css(lapBase, { top: LP.h + "px" });
  lapImg.style.transform = `translateY(${-eInOut(scroll) * 1500 * (LP.w / 1440)}px)`;
  laptop.style.transform = `translateY(${(1 - din) * 140}px) scale(${(1 + push * 0.12) * lerp(0.92, 1, din)})`;
  laptop.style.opacity = clamp(din * 2) * (1 - out);
  laptop.style.filter = `blur(${out * 12}px)`;
  // phone
  const PP = V ? { x: 640, y: 900, w: 360, h: 740 } : { x: 1560, y: 360, w: 300, h: 620 };
  css(lPhone.root, { left: PP.x + "px", top: PP.y + "px", width: PP.w + "px", height: PP.h + "px" });
  const pin = eOutExpo(seg(t, 20.25, 20.75));
  lPhone.img.style.transform = `translateY(${-eInOut(scroll) * (V ? 900 : 760)}px)`;
  lPhone.root.style.transform = `translateY(${(1 - pin) * 200}px) rotate(${lerp(10, 4, pin)}deg) scale(${1 + push * 0.18})`;
  lPhone.root.style.opacity = clamp(pin * 2) * (1 - out);
  lPhone.root.style.filter = `blur(${out * 12}px)`;
  // badges
  badges.forEach((b, i) => {
    const at = 21.0 + i * 0.5;
    const p = eOutBack(seg(t, at, at + 0.3));
    let x, y;
    if (V) { const row = i < 3 ? 0 : 1; const items = row ? badges.slice(3) : badges.slice(0, 3); const tw = items.reduce((s, e) => s + e.offsetWidth + 18, -18); let off = 0; for (const e of items) { if (e === b) break; off += e.offsetWidth + 18; } x = (W - tw) / 2 + off; y = 1700 + row * 96; }
    else { x = 110 + (i % 2) * 0; y = 560 + i * 90; }
    if (!V) { x = 110; y = 600 + i * 86; }
    css(b, { left: x + "px", top: y + "px", opacity: clamp(p * 2) * (1 - out) });
    b.style.transform = `translateX(${(1 - p) * -40}px) scale(${lerp(0.7, 1, p)})`;
  });
  if (!V) { lHead.style.top = "150px"; }
}

function renderCta(t) {
  show(S.cta, true);
  const fadeOut = seg(t, 29.55, 30.0);
  const hs = slam(t, 26.0, 0.35);
  const fin = t >= 29.0 ? 1 + 0.05 * Math.exp(-(t - 29) * 6) * Math.sin((t - 29) * 30) : 1;
  css(cHead, { top: (V ? 560 : 170) + "px" });
  cHead.style.opacity = hs.o; cHead.style.transform = `scale(${hs.s * fin})`;
  const u = eOutBack(seg(t, 26.5, 26.85));
  const uw = cUrl.offsetWidth;
  css(cUrl, { left: (W - uw) / 2 + "px", top: (V ? 900 : 480) + "px", opacity: clamp(u * 2) });
  const glint = t >= 29.0 ? 1 + 0.08 * Math.exp(-(t - 29) * 5) : 1;
  cUrl.style.transform = `translateY(${(1 - u) * 40}px) scale(${lerp(0.7, 1, u) * glint})`;
  const l = eOutCubic(seg(t, 27.0, 27.35));
  css(cLine, { top: (V ? 1080 : 650) + "px", opacity: l });
  cLine.style.transform = `translateY(${(1 - l) * 30}px)`;
  const pp = eOutBack(seg(t, 27.5, 27.8));
  const pw = cPromo.offsetWidth;
  css(cPromo, { left: (W - pw) / 2 + "px", top: (V ? 1200 : 750) + "px", opacity: clamp(pp * 2) });
  cPromo.style.transform = `scale(${lerp(0.6, 1, pp)}) rotate(${lerp(-6, -1.5, pp)}deg)`;
  const lg = eOutCubic(seg(t, 28.0, 28.4));
  css(cLogo, { top: (V ? 1700 : 935) + "px", opacity: lg });
  stage.style.filter = `brightness(${1 - fadeOut})`;
  if (t < 29.55) stage.style.filter = "";
}

window.render = render;
window.ready = (async () => {
  await document.fonts.ready;
  const imgs = new Set();
  for (const c of CUTS) { imgs.add(`${CAP}${c.k}-desk-${c.m}.jpg`); imgs.add(`${CAP}${c.k}-mob-${c.m}.jpg`); }
  await Promise.all([...imgs].map((src) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = src; })));
  await Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => (i.onload = i.onerror = r))));
  return true;
})();
render(+(Q.get("t") || 0));
</script>
